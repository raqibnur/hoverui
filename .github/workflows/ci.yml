name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege. A workflow that needs to write has to ask for it explicitly.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint · registry · build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Rebuild the registry
        run: npm run registry:build

      # docs/REGISTRY.md calls a stale public/r the single most common way to ship a
      # broken item: the effect changes, the JSON does not, and users install last week's
      # code. Rebuilding and diffing turns that from a discipline problem into a red X.
      - name: public/r must match the source it was built from
        run: |
          if ! git diff --quiet -- public/r; then
            echo "::error::public/r is stale. Run 'npm run registry:build' and commit the result."
            git diff --stat -- public/r
            exit 1
          fi

      - name: Build
        run: npm run build
